<header class="cabecera">
  <div class="barra">
    <span class="marca">otalora</span>
    <div class="idioma">
      <label for="language">{{ strings.language }}</label>
      <select id="language" [ngModel]="language" (ngModelChange)="changeLanguage($event)">
        @for (code of languageCodes; track code) {
          <option [value]="code" [attr.lang]="code">{{ languages[code] }}</option>
        }
      </select>
    </div>
  </div>
</header>

<main class="contenedor">
  <header>
    <div class="introduccion">
      <div>
        <h1>{{ strings.title }}</h1>
        <p>{{ strings.description }}</p>
      </div>
      <div class="emblema" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false">
          <rect x="6" y="14" width="20" height="14" rx="3"/>
          <path d="M10 14V9a6 6 0 0 1 12 0v5m-6 6v3"/>
        </svg>
      </div>
    </div>
  </header>

  <section class="generador" [attr.aria-label]="strings.title">
    <fieldset>
      <legend>{{ strings.settings }}</legend>
      <div class="opciones">
        <label><input type="checkbox" [(ngModel)]="mayus" (ngModelChange)="generarClave()"> {{ strings.uppercase }}</label>
        <label><input type="checkbox" [(ngModel)]="min" (ngModelChange)="generarClave()"> {{ strings.lowercase }}</label>
        <label><input type="checkbox" [(ngModel)]="nums" (ngModelChange)="generarClave()"> {{ strings.digits }}</label>
        <label><input type="checkbox" [(ngModel)]="simbolos" (ngModelChange)="generarClave()"> {{ strings.symbols }}</label>
      </div>

      <div class="longitud">
        <label for="length">{{ strings.length }} <span aria-hidden="true">{{ longitud }}</span></label>
        <input type="range" id="length" min="4" max="100" [(ngModel)]="longitud" (ngModelChange)="generarClave()">
      </div>
    </fieldset>

    <div class="resultado">
      <h2>{{ strings.result }}</h2>
      <p class="clave" dir="ltr"><code>{{ claveGenerada }}</code></p>
      <p class="estado fortaleza" role="status">
        @if (copyAvailable) {
          {{ strings.strength }} · {{ strings.strengths[nivelSeguridad] }}
        } @else {
          {{ strings.noGroups }}
        }
      </p>
    </div>

    <div class="acciones">
      <button type="button" class="principal" (click)="generarClave()" [disabled]="!copyAvailable">{{ strings.generate }}</button>
      <button type="button" (click)="copiarClave()" [disabled]="!copyAvailable">{{ strings.copy }}</button>
    </div>
    <p class="estado" role="status">{{ copyStatus ? strings[copyStatus] : '' }}</p>
  </section>
</main>
